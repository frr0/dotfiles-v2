config_version = 16

[bar.default]
concave_edge_corners = false
margin_ends = 0
padding = 0
panel_overlap = 0
radius = 0
scale = 1.1500000096857548
shadow = false
thickness = 28

[dock]
radius = 12

[hot_corners.top_left]
action = "window_switcher"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 682.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
app_icon_colorize = true
card_borders = false
corner_radius_scale = 0.45000000670552254
panel_anchor_bar = "default"
popup_shadows = false

    [shell.panel]
    floating_offset = 2

    [shell.screen_corners]
    size = 1

[theme]
builtin = "Gruvbox"
community_palette = "Ayu Blue"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/francesco/Scaricati"

    [wallpaper.default]
    path = "/home/francesco/Scaricati/photo_2025-10-09_13-14-36.jpg"

    [wallpaper.last]
    path = "/home/francesco/Scaricati/photo_2025-10-09_13-14-36.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/francesco/Scaricati/photo_2025-10-09_13-14-36.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/francesco/Scaricati/photo_2025-10-09_13-14-36.jpg"